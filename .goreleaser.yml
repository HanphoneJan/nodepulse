version: 2
project_name: nodepulse

# Keep GoReleaser output away from dist/, where make writes .deb and AppImage.
# `goreleaser release --clean` only clears this directory.
dist: dist/goreleaser

before:
  hooks:
    - go mod tidy

builds:
  - id: nodepulse
    main: ./cmd/nodepulse
    binary: nodepulse
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/HanphoneJan/nodepulse/internal/version.Version={{ .Version }}

archives:
  - id: nodepulse
    formats:
      - tar.gz
    name_template: "NodePulse-{{ .Os }}-{{ .Arch }}-{{ .Version }}"
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
