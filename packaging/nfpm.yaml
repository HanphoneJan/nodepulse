name: nodepulse
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: HanphoneJan <janhizian@163.com>
description: |
  Proxy node stability tester and auto-switcher.
  Measures success rate, P50/P90 latency and jitter, ranks nodes, and keeps
  a stable selector for Clash-compatible clients.
vendor: NodePulse
homepage: https://github.com/HanphoneJan/nodepulse
license: GPL-3.0-only
depends:
  - libgtk-3-0
  - liblzma5
  - libblkid1
contents:
  - src: bin/nodepulse
    dst: /usr/bin/nodepulse
  - src: packaging/nodepulse-desktop.sh
    dst: /usr/bin/nodepulse-desktop
  - src: desktop/build/linux/x64/release/bundle/nodepulse
    dst: /opt/nodepulse/nodepulse
  - src: desktop/build/linux/x64/release/bundle/nodepulse-core
    dst: /opt/nodepulse/nodepulse-core
  - src: desktop/build/linux/x64/release/bundle/data
    dst: /opt/nodepulse/data
    type: tree
  - src: desktop/build/linux/x64/release/bundle/lib
    dst: /opt/nodepulse/lib
    type: tree
  - src: packaging/nodepulse.desktop
    dst: /usr/share/applications/nodepulse.desktop
  - src: packaging/nodepulse.svg
    dst: /usr/share/icons/hicolor/scalable/apps/nodepulse.svg
  - src: packaging/nodepulse-daemon.service
    dst: /usr/lib/systemd/user/nodepulse-daemon.service
  - src: LICENSE
    dst: /usr/share/doc/nodepulse/LICENSE
  - src: THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/nodepulse/THIRD_PARTY_NOTICES.md
