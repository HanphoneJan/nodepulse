name: nodepulse
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: HanphoneJan <janhizian@163.com>
description: |
  Proxy node stability tester and auto-switcher.
  Measures success rate, P50/P90 latency and jitter, ranks nodes, and keeps
  a stable selector for Clash-compatible clients.
vendor: NodePulse
homepage: https://github.com/HanphoneJan/nodepulse
license: Apache-2.0
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
contents:
  - src: bin/nodepulse
    dst: /usr/bin/nodepulse
  - src: bin/nodepulse-gui
    dst: /usr/bin/nodepulse-gui
  - src: packaging/nodepulse.desktop
    dst: /usr/share/applications/nodepulse.desktop
  - src: packaging/nodepulse.svg
    dst: /usr/share/icons/hicolor/scalable/apps/nodepulse.svg
  - src: packaging/nodepulse-daemon.service
    dst: /usr/lib/systemd/user/nodepulse-daemon.service
  - src: LICENSE
    dst: /usr/share/doc/nodepulse/LICENSE
  - src: THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/nodepulse/THIRD_PARTY_NOTICES.md
  - src: internal/uiassets/dist/material-color-utilities.LICENSE.txt
    dst: /usr/share/doc/nodepulse/third-party/material-color-utilities-LICENSE.txt
  - src: internal/uiassets/dist/vendor/LICENSES/preact-LICENSE.txt
    dst: /usr/share/doc/nodepulse/third-party/preact-LICENSE.txt
  - src: internal/uiassets/dist/vendor/LICENSES/htm-LICENSE.txt
    dst: /usr/share/doc/nodepulse/third-party/htm-LICENSE.txt
  - src: internal/uiassets/dist/vendor/LICENSES/floating-ui-LICENSE.txt
    dst: /usr/share/doc/nodepulse/third-party/floating-ui-LICENSE.txt
  - src: internal/uiassets/dist/icons.LICENSE.txt
    dst: /usr/share/doc/nodepulse/third-party/material-symbols-LICENSE.txt
