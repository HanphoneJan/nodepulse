<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#007aff" />
  <title>NodePulse</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/00-tokens.css" />
  <link rel="stylesheet" href="css/01-base.css" />
  <link rel="stylesheet" href="css/02-layout.css" />
  <link rel="stylesheet" href="css/03-components.css" />
  <link rel="stylesheet" href="css/04-views.css" />
  <link rel="stylesheet" href="css/05-responsive.css" />
  <script>
    (function () {
      var key = "nodepulse.themeMode.v2";
      var mode = "system";
      try { mode = localStorage.getItem(key) || "system"; } catch (_) {}
      if (mode !== "system" && mode !== "light" && mode !== "dark") mode = "system";
      var light = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      var dark = mode === "dark" || (mode === "system" && !light);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.dataset.themeMode = mode;
      try {
        var seed = localStorage.getItem("nodepulse.seed.v2");
        if (seed) document.documentElement.dataset.seed = seed;
        var cached = localStorage.getItem("nodepulse.seedCss.v2");
        if (cached) {
          var style = document.createElement("style");
          style.id = "seed-theme-cache";
          style.textContent = cached;
          document.head.appendChild(style);
        }
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="vendor/floating-ui.core.umd.min.js"></script>
  <script src="vendor/floating-ui.dom.umd.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
