name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev liblzma-dev libblkid-dev pkg-config ninja-build clang

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install appimagetool
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
          curl -fsSL -o /usr/local/bin/appimagetool-runtime \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          chmod +x /usr/local/bin/appimagetool-runtime

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          APPIMAGE_RUNTIME_FILE: /usr/local/bin/appimagetool-runtime
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          VERSION="${VERSION#v}" make build desktop deb
          VERSION="${VERSION#v}" make appimage || true

      - name: GoReleaser (CLI archives)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .deb and AppImage
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
