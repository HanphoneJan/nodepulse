name: desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path (Join-Path $nsis "makensis.exe"))) { throw "NSIS not found" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
      - name: Build Windows installer and zip
        shell: pwsh
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.3.7' }}
        run: |
          $env:VERSION = $env:VERSION.TrimStart("v")
          .\packaging\build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: nodepulse-windows
          path: dist/NodePulse-windows-amd64-*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/NodePulse-windows-amd64-*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build macOS zip and dmg
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.3.7' }}
        run: |
          export VERSION="${VERSION#v}"
          bash packaging/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: nodepulse-macos
          path: dist/NodePulse-macos-universal-*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/NodePulse-macos-universal-*

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Build Android APK
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.3.7' }}
        run: |
          export VERSION="${VERSION#v}"
          FLUTTER=flutter bash packaging/build-android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: nodepulse-android
          path: dist/NodePulse-android-arm64-*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/NodePulse-android-arm64-*
