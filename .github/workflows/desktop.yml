name: desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Build Windows zip
        shell: pwsh
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.3.0' }}
        run: |
          $env:VERSION = $env:VERSION.TrimStart("v")
          .\packaging\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nodepulse-windows
          path: dist/*windows_amd64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*windows_amd64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build macOS zip
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.3.0' }}
        run: |
          export VERSION="${VERSION#v}"
          bash packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nodepulse-macos
          path: dist/*macos_universal.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*macos_universal.zip
