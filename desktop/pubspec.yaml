name: nodepulse
description: NodePulse desktop UI, built with Flutter and the FlClash design system.
publish_to: "none"
version: 0.3.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.9.0
  material_color_utilities: ^0.13.0
  http: ^1.6.0
  window_manager: ^0.6.0
  tray_manager: ^0.8.2
  file_picker: ^11.0.3
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  launch_at_startup: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
